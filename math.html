<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculator Math</title><style>body{font-family:system-ui,-apple-system,sans-serif;background:#f5f5f2;color:#172018;margin:0}.wrap{max-width:760px;margin:auto;padding:22px 14px 50px}.card{background:white;border:1px solid #ddd;border-radius:14px;padding:16px;margin:12px 0}.muted{color:#687268}.line{padding:4px 0;overflow-wrap:anywhere}a{color:#193d2b;font-weight:750}table{border-collapse:collapse;width:100%;font-size:.85rem}td,th{padding:8px;text-align:left;border-bottom:1px solid #ddd}.scroll{overflow-x:auto}</style></head><body><div class="wrap"><a href="index.html">← Back to calculator</a><h1>Simple Calculator Math</h1><p class="muted">Uses your saved analysis. No RentCast request.</p><div id="content"></div></div><script src="core.js"></script><script>
'use strict';
const el=document.getElementById('content'),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const money=n=>n==null?'Unavailable':new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(n);
let d;try{d=JSON.parse(sessionStorage.getItem('brrrrLastAnalysisV5'));}catch{}
if(!d?.subject||!Array.isArray(d.comps))el.innerHTML='<div class="card">Run an analysis first.</div>';
else{
 const model=Brrrr.appraisalModel(d,d.valuationDate||d.analysisDate||Date.now()),f=Brrrr.financials(d,model.arv);
 const sorted=model.used.slice().sort((a,b)=>a.c.price-b.c.price);let cumulative=0;
 const rows=sorted.map(r=>{cumulative+=r.normalizedWeight;return `<tr><td>${esc(r.c.formattedAddress||r.c.id)}</td><td>${money(r.c.price)}</td><td>${r.score.toFixed(3)}</td><td>${(r.normalizedWeight*100).toFixed(2)}%</td><td>${(cumulative*100).toFixed(2)}%</td></tr>`;}).join('');
 const rehab=d.rehabIsManual?`Manual rehab = ${money(d.rehab)}`:Brrrr.positive(d.subject.squareFootage)?`${d.subject.squareFootage.toLocaleString()} total sq ft × $${d.rehabRate} = ${money(d.rehab)}`:`35% purchase fallback = ${money(d.rehab)}`;
 const other=d.otherIsManual?`Manual other costs = ${money(d.otherCosts)}`:`Round(7% × (${money(d.purchasePrice)} + ${money(d.rehab)})) = ${money(d.otherCosts)}`;
 el.innerHTML=`<div class="card"><h2>1. Sale evidence</h2><p>${esc(d.subject.formattedAddress)} · ${esc(model.selectionMode)} set · ${esc(model.area.kind)}</p><p>Automatic selection uses 3–5 distinct provider-reported sales within 2 miles and 730 days, after physical guardrails. Quality score is the sum of the dimensionless penalties shown under each comp’s Evidence details. Lower scores mean better matches.</p><div class="line">Raw weight = 1 ÷ (1 + score)².</div><div class="line">Normalize weights to 100%. Redistribute any weight above 40% among the other selected sales.</div><div class="line">Sort provider-reported sale amounts. ARV is the price at which cumulative weight crosses 50%; at exactly 50%, average the two adjacent prices.</div><div class="scroll"><table><thead><tr><th>Comp</th><th>Provider sale amount</th><th>Score</th><th>Weight</th><th>Cumulative</th></tr></thead><tbody>${rows}</tbody></table></div><p>Screening ARV: <strong>${money(f.arv)}</strong>. Observed selected-sale range: ${money(model.low)}–${money(model.high)}. This range is not a statistical confidence interval.</p><p class="muted">${model.warnings.map(esc).join(' ')}</p></div><div class="card"><h2>2. Rehab</h2><div class="line">${rehab}</div><p class="muted">Rehab uses total indoor living area; above-grade corrections affect comp selection, not this cost assumption.</p></div><div class="card"><h2>3. Other costs and basis</h2><div class="line">${other}</div><div class="line">${money(d.purchasePrice)} + ${money(d.rehab)} + ${money(d.otherCosts)} = ${money(d.totalBasis)}</div></div><div class="card"><h2>4. Refinance and cash result</h2><div class="line">${money(f.arv)} × ${(d.ltv*100).toFixed(2)}% = ${money(f.refi)}</div><div class="line">${money(f.refi)} − ${money(d.totalBasis)} = ${money(f.cashResult)} cash result</div><div class="line">${money(f.arv)} − ${money(f.refi)} = ${money(f.equity)} equity remaining</div></div><div class="card"><h2>5. Max purchase</h2><div class="line">${d.otherIsManual?`${money(f.refi)} − ${money(d.rehab)} − ${money(d.otherCosts)}`:`${money(f.refi)} ÷ 1.07 − ${money(d.rehab)}`} = ${money(f.maxPurchase)}</div><p class="muted">The automatic formula solves refi = 1.07 × (purchase + rehab). The displayed maximum is a continuous dollar estimate; other costs on a new analysis round to the nearest dollar.</p></div>`;
}
</script></body></html>
