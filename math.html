<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculator Math</title><style>body{font-family:system-ui,-apple-system,sans-serif;background:#f5f5f2;color:#172018;margin:0}.wrap{max-width:760px;margin:auto;padding:22px 14px 50px}.card{background:white;border:1px solid #ddd;border-radius:14px;padding:16px;margin:12px 0}.muted{color:#687268}.line{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;padding:4px 0;overflow-wrap:anywhere}a{color:#193d2b;font-weight:750;text-decoration:none}</style></head><body><div class="wrap"><a href="index.html">← Back to calculator</a><h1>Simple Calculator Math</h1><p class="muted">This page reads the most recent analysis in this browser tab. It makes no RentCast request.</p><div id="content"></div><script>
const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(Math.round(Number(n)||0));let d=null;try{d=JSON.parse(sessionStorage.getItem('brrrrLastAnalysisV5'))}catch(_){}const el=document.getElementById('content');if(!d){el.innerHTML='<div class="card">Run an analysis first.</div>'}else{const rehab=d.rehabIsManual?`Manual rehab = ${money(d.rehab)}`:(Number(d.subject?.squareFootage)>0?`${Number(d.subject.squareFootage).toLocaleString()} sq ft × $${Number(d.rehabRate).toFixed(0)} = ${money(d.rehab)}`:`35% purchase fallback = ${money(d.rehab)}`);const other=d.otherIsManual?`Manual other costs = ${money(d.otherCosts)}`:`7% × (${money(d.purchasePrice)} + ${money(d.rehab)}) = ${money(d.otherCosts)}`;const max=d.otherIsManual?`${money(d.refi)} − ${money(d.rehab)} − ${money(d.otherCosts)} = ${money(d.maxPurchase)}`:`${money(d.refi)} ÷ 1.07 − ${money(d.rehab)} = ${money(d.maxPurchase)}`;el.innerHTML=`<div class="card"><h2>1. ARV</h2><div class="line">Candidate universe: same property type, within 2 miles, sold in last 730 days.</div><div class="line">Hard physical guardrails are applied before ranking.</div><div class="line">Automatic comp set: 3–5 defensible closed sales; fewer than 3 = insufficient evidence.</div><div class="line">ARV = similarity-weighted median of actual selected closed-sale prices.</div><p class="muted">No AVM, listing price, price-per-square-foot multiplication, Huber averaging, or invented dollar adjustments.</p></div><div class="card"><h2>2. Rehab</h2><div class="line">${rehab}</div></div><div class="card"><h2>3. Other costs</h2><div class="line">${other}</div></div><div class="card"><h2>4. Total basis</h2><div class="line">${money(d.purchasePrice)} + ${money(d.rehab)} + ${money(d.otherCosts)} = ${money(d.totalBasis)}</div></div><div class="card"><h2>5. Refinance</h2><div class="line">${money(d.arv)} × ${(Number(d.ltv)*100).toFixed(0)}% = ${money(d.refi)}</div><div class="line">${money(d.refi)} − ${money(d.totalBasis)} = ${money(d.cashResult)} cash result</div><div class="line">${money(d.arv)} − ${money(d.refi)} = ${money(d.equity)} equity remaining</div></div><div class="card"><h2>6. Max purchase</h2><div class="line">${max}</div></div>`}</script></div></body></html>
